# Configuração do flutter_launcher_icons (design.md §9). Os PNGs vêm de
# `flutter test tool/icon/generate_icon_test.dart`; depois, para aplicar:
#
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  # O iOS recusa ícone com canal alfa.
  remove_alpha_ios: true
  # Android adaptativo e ícone temático (Android 13+).
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
