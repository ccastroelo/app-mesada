name: CI

# Marco M0: a cada push em main e em todo pull request, análise estática e
# testes do app em app-flutter/. Os testes das regras do Firestore
# (app-flutter/firebase-tests) ficam fora: precisam do emulador e de Java.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-e-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-flutter
    steps:
      - uses: actions/checkout@v4

      # Versão fixa, igual à do baseline em docs/agents/flutter.md. Se um dia
      # o runner não encontrar esta versão, trocar por `channel: stable`.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test
